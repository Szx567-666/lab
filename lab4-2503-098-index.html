<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书系统</title>
    <link rel="stylesheet" href="./css/lab4-2503-098-index.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-box {
            background: #fff;
            width: 380px;
            padding: 30px;
            border-radius: 8px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #666;
        }
        .modal-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-item {
            margin-bottom: 18px;
        }
        .form-item label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }
        .form-item input {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            height: 42px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: linear-gradient(45deg, #2980b9, #1f618d);
            transform: scale(1.05);
        }
        .to-reg, .to-login {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        .to-reg a, .to-login a {
            color: #3498db;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">春韵书店</div>
        <ul class="nav">
            <li><a href="#">首页</a></li>
            <li><a href="#">图书分类</a></li>
            <li><a href="#">新书上架</a></li>
            <li><a href="#"><span class="icon-animate">🔍</span> 搜索</a></li>
            <li><a href="#"><span class="icon-animate">🛒</span> 购物车</a></li>
            <li><a href="#" id="loginBtn">登录</a></li>
            <li><a href="#" id="regBtn">注册</a></li>
        </ul>
    </div>

    <div class="container">
        <div class="left-sidebar">
            <h3>图书分类</h3>
            <ul>
                <li><a href="#">文学小说</a></li>
                <li><a href="#">科技计算机</a></li>
                <li><a href="#">经管励志</a></li>
                <li><a href="#">少儿读物</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="carousel-box">
                <div class="carousel-images">
                    <img src="./img/banner1.jpg" alt="轮播1">
                    <img src="./img/banner2.jpg" alt="轮播2">
                    <img src="./img/banner3.jpg" alt="轮播3">
                </div>
            </div>

            <section>
                <h3>图书展示区</h3>
                <div class="book-list">
                    <div class="book-item">
                        <img src="./img/book1.jpg" alt="封面1">
                    </div>
                    <div class="book-item">
                        <img src="./img/book2.jpg" alt="封面2">
                    </div>
                </div>
            </section>

            <section class="hot-recommend">
            <h3>热门推荐</h3>
                <div class="hot-list">
                    <div class="hot-item">《三体》</div>
                    <div class="hot-item">《活着》</div>
                    <div class="hot-item">《平凡的世界》</div>
                </div>
            </section>

            <section class="new-books">
                <h3>新书上市</h3>
                <table border="1">
                    <tr>
                        <th>书名</th>
                        <th>作者</th>
                        <th>价格</th>
                    </tr>
                    <tr>
                        <td>《鲁滨逊漂流记》</td>
                        <td>迪福</td>
                        <td>￥39.9</td>
                    </tr>
                    <tr>
                        <td>巴黎圣母院</td>
                        <td>雨果</td>
                        <td>￥45.9</td>
                    </tr>
                </table>
            </section>

            <aside class="right-sidebar">
                <div class="promo-box">
                    <h3>限时促销</h3>
                    <p>满100减20</p>
                    <p>全场图书8折起</p>
                </div>
            </aside>
        </div>
        <aside class="right-sidebar">
            <div class="promo-box">
                <h3>限时促销</h3>
                <p>满100减20</p>
                <p>全场图书8折起</p>
            </div>
        </aside>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-box">
            <span class="modal-close" id="closeLogin">×</span>
            <h2>用户登录</h2>
            <div class="form-item">
                <label>用户名</label>
                <input type="text" placeholder="请输入用户名">
            </div>
            <div class="form-item">
                <label>密码</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <button class="btn">登录</button>
            <div class="to-reg">
                没有账号？<a id="goToReg">立即注册</a>
            </div>
        </div>
    </div>

    <div class="modal" id="regModal">
        <div class="modal-box">
            <span class="modal-close" id="closeReg">×</span>
            <h2>用户注册</h2>
            <div class="form-item">
                <label>用户名</label>
                <input type="text" placeholder="请输入用户名">
            </div>
            <div class="form-item">
                <label>密码</label>
                <input type="password" placeholder="请输入密码">
            </div>
            <div class="form-item">
                <label>确认密码</label>
                <input type="password" placeholder="请再次输入密码">
            </div>
            <button class="btn">注册</button>
            <div class="to-login">
                已有账号？<a id="goToLogin">立即登录</a>
            </div>
        </div>
    </div>
    <script>
        const loginBtn = document.getElementById('loginBtn');
        const regBtn = document.getElementById('regBtn');
        const loginModal = document.getElementById('loginModal');
        const regModal = document.getElementById('regModal');
        const closeLogin = document.getElementById('closeLogin');
        const closeReg = document.getElementById('closeReg');
        const goToReg = document.getElementById('goToReg');
        const goToLogin = document.getElementById('goToLogin');

        const loginConfirm = document.querySelector('#loginModal .btn');
        const regConfirm = document.querySelector('#regModal .btn');

        let users = [{ username: "test", password: "123" }];

        loginBtn.onclick = () => { loginModal.classList.add('show'); regModal.classList.remove('show'); };
        regBtn.onclick = () => { regModal.classList.add('show'); loginModal.classList.remove('show'); };
        closeLogin.onclick = () => { loginModal.classList.remove('show'); };
        closeReg.onclick = () => { regModal.classList.remove('show'); };
        goToReg.onclick = () => { loginModal.classList.remove('show'); regModal.classList.add('show'); };
        goToLogin.onclick = () => { regModal.classList.remove('show'); loginModal.classList.add('show'); };

        loginConfirm.onclick = () => {
        const username = loginModal.querySelector('input[type="text"]').value.trim();
        const password = loginModal.querySelector('input[type="password"]').value;
        if (!username || !password) { alert("请输入用户名和密码！"); return; }
        const user = users.find(u => u.username === username);
        if (!user) { alert("用户未注册！"); return; }
        if (user.password !== password) { alert("密码错误！"); return; }
        alert("登录成功！");
        loginModal.classList.remove('show');
        };

        regConfirm.onclick = () => {
        const username = regModal.querySelectorAll('input')[0].value.trim();
        const pwd1 = regModal.querySelectorAll('input')[1].value;
        const pwd2 = regModal.querySelectorAll('input')[2].value;
        if (!username || !pwd1 || !pwd2) { alert("请填写完整信息！"); return; }
        if (pwd1 !== pwd2) { alert("两次密码不一致！"); return; }
        const exists = users.find(u => u.username === username);
        if (exists) { alert("用户名已存在！"); return; }
        users.push({ username, password: pwd1 });
        alert("注册成功！");
        regModal.classList.remove('show');
        };
    </script>
</body>
</html>
